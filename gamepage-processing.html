<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />
    <title>Peasants and Plunderers</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>Peasants and Plunderers</h1>
      <h4 class="game-code-notification">Game code: &lt;code&gt;</h4>
      <!-- Navigation elements -->
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="landing.html" class="link-warning">Quit Game</a></li>
        </menu>
      </nav>
      <hr />
      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
    </header>

    <main>
      <div>
        <img src="assets/imgs/dev/Account-Image-Generic.png" class="avatar-img-small">
        <span class="score-text-midgame"> -> 500</span>
      </div>
      <div>
        <span>(me)</span>
        <img src="assets/imgs/dev/Account-Image-Generic.png" class="avatar-img-small">
        <span class="score-text-midgame"> -> 300</span>
      </div>
      <div>
        <img src="assets/imgs/dev/Account-Image-Generic.png" class="avatar-img-small">
        <span class="score-text-midgame"> -> 200</span>
      </div>
      <div>
        <img src="assets/imgs/dev/Account-Image-Generic.png" class="avatar-img-small">
        <span class="score-text-midgame"> -> 450</span>
      </div>
      <div>
        <p>Everyone selected an option. Processing results...</p>
      </div>
      <hr />
      <form method="get" action="gamepage-update.html">
        <button type="submit" class="technical-button disabled-button">Farm</button>
        <button type="submit" class="technical-button disabled-button">Guard</button>
        <button type="submit" class="technical-button disabled-button">Plunder</button>
      </form>
    </main>

    <footer>
      <hr />
      <span class="copyright-disclaimer">Jon Hitchcock, Copyright 2026</span>
      <br />
      <a href="https://github.com/JonHBYU/startup" class="special-link">GitHub</a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
