<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peasants and Plunderers</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>Peasants and Plunderers</h1>
      <h4>Game code: &lt;code&gt;</h4>
      <!-- Navigation elements -->
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="landing.html">Quit Game</a></li>
        </menu>
      </nav>
      <hr />
      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
    </header>

    <main>
      <div>
        <img src="assets/imgs/dev/Account-Image-Generic.png" width="32px">
        <span> -> 500</span>
      </div>
      <div>
        <span>(me)</span>
        <img src="assets/imgs/dev/Account-Image-Generic.png" width="32px">
        <span> -> 300</span>
      </div>
      <div>
        <img src="assets/imgs/dev/Account-Image-Generic.png" width="32px">
        <span> -> 200</span>
      </div>
      <div>
        <img src="assets/imgs/dev/Account-Image-Generic.png" width="32px">
        <span> -> 450</span>
      </div>
      <div>
        <p>Everyone selected an option. Processing results...</p>
      </div>
      <hr />
      <form method="get" action="gamepage-update.html">
        <button type="submit">Farm</button>
        <button type="submit">Guard</button>
        <button type="submit">Plunder</button>
      </form>
    </main>

    <footer>
      <hr />
      <span>Jon Hitchcock, Copyright 2026</span>
      <br />
      <a href="https://github.com/JonHBYU/startup">GitHub</a>
    </footer>
  </body>
</html>
