<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="peasants-and-plunderers-base.css" rel="stylesheet" />
    <title>Peasants and Plunderers | Home</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header>
      <h1>Peasants and Plunderers</h1>
      <span>Your Highscore: <span id="score-value">&lt;score&gt;</span></span>
      <!-- Navigation elements -->
      <nav>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <menu>
          <li><a href="index.html">Delete Account</a></li>
          <li><a href="login.html">Logout</a></li>
        </menu>
      </nav>
      <hr />
      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
    </header>

    <main>
        <form method="get" action="gamepage-start.html">
          <span>Welcome, &lt;username&gt;!</span>
          <p>Enter game code below, or leave blank to start a new game:</p>
          <input type="number" placeholder="Game Code" />
          <button type="submit" class="btn technical-button">Start Game</button>
        </form>
    </main>

    <footer>
      <hr />
      <span class="copyright-disclaimer">Copyright 2026, Jon Hitchcock</span>
      <br />
      <a href="https://github.com/JonHBYU/startup" class="special-link">GitHub</a>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </body>
</html>
